apiVersion: v1
kind: Service
metadata:
  name: alan-status-headless
spec:
  clusterIP: None
  selector:
    app: alan-status
  ports:
    - name: udp
      port: 5000
      targetPort: 5000
      protocol: UDP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: alan-status
spec:
  selector:
    app: alan-status
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alan-status
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alan-status
  template:
    metadata:
      labels:
        app: alan-status
    spec:
      containers:
        - name: alan-status
          image: alan-status:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              protocol: UDP
              name: udp
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            - name: ALAN_DNS_ADDR
              value: "alan-status-headless.alan-status.svc.cluster.local"
            - name: ALAN_PORT
              value: "5000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
