\* TLC configuration: demonstrates the README's documented "startup race".
\*
\* Setup:   2 peers, quorum disabled (Replicas = 0 in alan), no partitions.
\* Expect:  MutualExclusion VIOLATED — TLC produces a counter-example where
\*          both peers fire AcquireNoPeers before they discover each other,
\*          and end up in StateSelfHeld simultaneously.
\*
\* Run:
\*    java -jar tla2tools.jar -config LockSpec_StartupRace.cfg LockSpec.tla

SPECIFICATION Spec

CONSTANTS
    Peers            = {p1, p2}
    MaxAttempts      = 2
    RequireQuorum    = FALSE
    EnableDisconnect = FALSE

INVARIANTS
    TypeInv
    MutualExclusion

\* Symmetry: peer identifiers are interchangeable.

CHECK_DEADLOCK FALSE
