\* FIFO + partitions enabled. Expected: still violated, because the
\* fundamental partition split-brain (a peer holding the lock losing
\* contact while the surviving quorum acquires the lock) is unrelated
\* to the message-ordering bug. This is the README's documented
\* "best-effort during partitions".

SPECIFICATION Spec

CONSTANTS
    Peers            = {p1, p2, p3}
    MaxAttempts      = 2
    RequireQuorum    = TRUE
    EnableDisconnect = TRUE

INVARIANTS
    TypeInv
    MutualExclusion

CHECK_DEADLOCK FALSE
