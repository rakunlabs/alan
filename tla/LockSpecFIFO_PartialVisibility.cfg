\* Add statements after this line.
\* Partial-visibility startup race. p1 starts SelfHeld; p2 and p3 boot
\* afterward. If they establish their handshakes asymmetrically (p2↔p3
\* before p2↔p1 / p3↔p1) and HasQuorum is met from |visible|+1 alone
\* without seeing p1, the model can drive p2 (or p3) into SelfHeld
\* concurrently with p1 — the documented "startup race" but in a
\* less obvious shape (p1 has FINISHED its acquisition, not just
\* started; p2 sees a fellow survivor but not the holder).

SPECIFICATION Spec

CONSTANTS
    Peers            = {p1, p2, p3}
    MaxAttempts      = 2
    RequireQuorum    = TRUE
    EnableDisconnect = FALSE
    PreHeldPeer      = p1

INVARIANTS
    TypeInv
    MutualExclusion

CHECK_DEADLOCK FALSE
