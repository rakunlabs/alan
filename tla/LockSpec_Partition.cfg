\* TLC configuration: demonstrates the README's "during partitions, multiple
\* peers may believe they hold the lock" admission.
\*
\* Setup:   3 peers, quorum required, partitions ENABLED.
\* Expect:  MutualExclusion VIOLATED. TLC produces a counter-example where
\*          a peer holding the lock partitions away from the rest, the
\*          remaining peers (still meeting quorum) acquire the lock, and
\*          two peers end up in StateSelfHeld at the same time.
\*
\* Run:
\*    java -jar tla2tools.jar -config LockSpec_Partition.cfg LockSpec.tla

SPECIFICATION Spec

CONSTANTS
    Peers            = {p1, p2, p3}
    MaxAttempts      = 2
    RequireQuorum    = TRUE
    EnableDisconnect = TRUE

INVARIANTS
    TypeInv
    MutualExclusion


CHECK_DEADLOCK FALSE
